name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history + tags to compute version

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore NameGuard.ML.sln

      - name: Build
        run: dotnet build NameGuard.ML.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NameGuard.ML.sln --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

      - name: Pack NameGuard.ML.Core
        run: dotnet pack NameGuard.ML.Core/NameGuard.ML.Core.csproj --configuration Release --no-build --output ./nupkg

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: NameGuard.ML.Core-nupkg
          path: ./nupkg/*.*nupkg
          retention-days: 30

  trainer-verify:
    name: Verify trainer reproduces model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore NameGuard.ML.Trainer/NameGuard.ML.Trainer.csproj

      - name: Build trainer
        run: dotnet build NameGuard.ML.Trainer/NameGuard.ML.Trainer.csproj --configuration Release --no-restore

      - name: Run trainer with AUC gate (>= 0.99)
        run: dotnet run --project NameGuard.ML.Trainer/NameGuard.ML.Trainer.csproj --configuration Release --no-build -- --min-auc 0.99
